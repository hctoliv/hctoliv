<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Demonstração da central de marketing da InoveLabor com dados fictícios.">
<title>InoveLabor Marketing</title>
<style>
/* InoveLabor Marketing — design tokens */
:root {
  color-scheme: light;
  --bg: #f4f3f0;
  --surface: #fcfcfb;
  --surface-2: #f0efec;
  --surface-3: #e6e4df;
  --border: #dedcd6;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7a7974;
  --accent: #1f7474;
  --accent-ink: #ffffff;
  --focus: #2a78d6;
  --grid: #e6e4df;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --critical-text: #b42b2b;
  --good-bg: #e6f4e6;
  --warning-bg: #fdf3dc;
  --critical-bg: #fbe7e7;
  --info-bg: #e3eefb;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.06);
  --radius: 10px;
  --radius-sm: 6px;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sidebar-w: 236px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #232321;
    --surface-3: #2d2d2a;
    --border: #34342f;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --text-3: #93928a;
    --accent: #4bb8a9;
    --accent-ink: #0b1f1f;
    --focus: #3987e5;
    --grid: #2d2d2a;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --good-text: #4cc94c;
    --critical-text: #f08a8a;
    --good-bg: #16301a;
    --warning-bg: #3a2f12;
    --critical-bg: #3b1a1a;
    --info-bg: #15263b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211;
  --surface: #1a1a19;
  --surface-2: #232321;
  --surface-3: #2d2d2a;
  --border: #34342f;
  --text: #ffffff;
  --text-2: #c3c2b7;
  --text-3: #93928a;
  --accent: #4bb8a9;
  --accent-ink: #0b1f1f;
  --focus: #3987e5;
  --grid: #2d2d2a;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --good-text: #4cc94c;
  --critical-text: #f08a8a;
  --good-bg: #16301a;
  --warning-bg: #3a2f12;
  --critical-bg: #3b1a1a;
  --info-bg: #15263b;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.35);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 16px; font-weight: 620; }
h3 { font-size: 14px; font-weight: 620; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--text-2); }
.subtle { color: var(--text-3); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Layout ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand { padding: 20px 20px 12px; display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font-weight: 800; font-size: 13px; letter-spacing: -0.04em;
}
.brand-name { font-weight: 750; letter-spacing: 0.08em; font-size: 13px; }
.brand-sub { font-size: 11px; color: var(--text-3); letter-spacing: 0.02em; }
.nav { padding: 8px 10px 16px; display: flex; flex-direction: column; gap: 1px; }
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-3); padding: 14px 10px 4px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-sm);
  text-decoration: none; color: var(--text-2); font-weight: 500;
}
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--surface-3); color: var(--text); }
.nav svg { width: 17px; height: 17px; flex-shrink: 0; }
.nav .count { margin-left: auto; font-size: 11px; background: var(--critical); color: #fff; border-radius: 10px; padding: 0 6px; }
.sidebar-foot { margin-top: auto; padding: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.user-chip { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: var(--radius-sm); text-decoration: none; }
.user-chip:hover { background: var(--surface-2); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center;
  font-size: 12px; font-weight: 650; flex-shrink: 0;
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: none; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surface);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
}
.content { padding: 28px 32px 48px; max-width: 1400px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head p { margin-top: 4px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.backdrop { display: none; }

@media (max-width: 900px) {
  .sidebar { position: fixed; z-index: 50; left: 0; transform: translateX(-100%); transition: transform 0.2s; box-shadow: var(--shadow); }
  .shell.nav-open .sidebar { transform: none; }
  .shell.nav-open .backdrop { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.35); z-index: 40; }
  .topbar { display: flex; }
  .content { padding: 20px 16px 40px; }
}

/* ---------- Components ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: minmax(0, 1fr); } .span-2 { grid-column: auto; } }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

.stat { display: flex; flex-direction: column; gap: 4px; }
.stat-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.stat-value { font-size: 26px; font-weight: 680; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.stat-foot { font-size: 12px; color: var(--text-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.delta { font-weight: 600; font-size: 12px; }
.delta.up { color: var(--good-text); }
.delta.down { color: var(--critical-text); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); cursor: pointer;
  font-weight: 550; white-space: nowrap; text-decoration: none; min-height: 34px;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { opacity: 0.9; }
.btn.danger { color: var(--critical-text); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 3px 9px; min-height: 28px; font-size: 13px; }
.btn.icon { padding: 6px; min-height: 32px; width: 32px; }
.btn svg { width: 16px; height: 16px; }
.btn.block { width: 100%; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12px; font-weight: 600; color: var(--text-2); }
.field .help { font-size: 12px; color: var(--text-3); }
.input, select.input, textarea.input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--surface); min-height: 36px;
}
textarea.input { min-height: 90px; resize: vertical; }
.input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: transparent; }
.check { display: flex; gap: 8px; align-items: center; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 600px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.search { max-width: 260px; }

.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px;
  font-weight: 550; background: var(--surface-3); color: var(--text-2); white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.8; }
.badge.plain::before { display: none; }
.badge.good { background: var(--good-bg); color: var(--good-text); }
.badge.warn { background: var(--warning-bg); color: var(--text); }
.badge.warn::before { background: var(--warning); opacity: 1; }
.badge.bad { background: var(--critical-bg); color: var(--critical-text); }
.badge.info { background: var(--info-bg); color: var(--text); }
.badge.info::before { background: var(--series-1); opacity: 1; }

.alert { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.alert.error { background: var(--critical-bg); color: var(--critical-text); }
.alert.info { background: var(--info-bg); }
.alert.warn { background: var(--warning-bg); }
.alert.ok { background: var(--good-bg); color: var(--good-text); }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th {
  text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 8px 10px;
  border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none;
}
.table th.sortable { cursor: pointer; }
.table th.sortable:hover { color: var(--text); }
.table td { padding: 9px 10px; border-bottom: 1px solid var(--surface-3); vertical-align: middle; }
.table tr.clickable { cursor: pointer; }
.table tr.clickable:hover td { background: var(--surface-2); }
.table .right { text-align: right; }
.table .truncate { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { padding: 32px 16px; text-align: center; color: var(--text-3); }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs button {
  border: none; background: none; padding: 8px 12px; cursor: pointer; color: var(--text-2); font-weight: 550;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

/* Modal */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: grid; place-items: center; z-index: 100; padding: 16px;
}
.modal {
  background: var(--surface); border-radius: 12px; width: min(640px, 100%); max-height: calc(100vh - 32px);
  display: flex; flex-direction: column; box-shadow: var(--shadow); border: 1px solid var(--border);
}
.modal.wide { width: min(920px, 100%); }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

/* Toasts */
.toasts { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 200; max-width: calc(100vw - 32px); }
.toast { background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow); max-width: 420px; }
.toast.error { background: var(--critical); color: #fff; }

/* Auth screens */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.auth-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 32px; box-shadow: var(--shadow); }
.auth-card .brand { padding: 0 0 24px; }
.auth-card h1 { font-size: 20px; margin-bottom: 6px; }
.auth-card form { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
.qr { width: 196px; height: 196px; margin: 8px auto; background: #fff; padding: 6px; border-radius: 8px; }
.qr svg { width: 100%; height: 100%; display: block; }
.secret { font-family: ui-monospace, Menlo, monospace; font-size: 13px; letter-spacing: 0.08em; word-break: break-all; background: var(--surface-2); padding: 8px 10px; border-radius: 6px; text-align: center; }
.codes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 14px; background: var(--surface-2); padding: 12px; border-radius: 8px; }
.otp-input { font-size: 22px; letter-spacing: 0.4em; text-align: center; font-family: ui-monospace, Menlo, monospace; }
.strength { height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; }
.strength > span { display: block; height: 100%; width: 0; transition: width 0.2s; }
.link-btn { background: none; border: none; padding: 0; color: var(--text-2); text-decoration: underline; cursor: pointer; font-size: 13px; }

/* Kanban */
.kanban { display: grid; grid-template-columns: repeat(4, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; }
.kcol { background: var(--surface-2); border-radius: var(--radius); padding: 10px; min-height: 200px; display: flex; flex-direction: column; gap: 8px; }
.kcol.drop { outline: 2px dashed var(--focus); outline-offset: -2px; }
.kcol-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 6px; font-weight: 620; }
.kcard { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: grab; display: flex; flex-direction: column; gap: 6px; }
.kcard:hover { border-color: var(--text-3); }
.kcard.dragging { opacity: 0.5; }
.kcard .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-3); }
.overdue { color: var(--critical-text); font-weight: 600; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
.cal-dow { font-size: 11px; text-transform: uppercase; color: var(--text-3); padding: 6px 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.cal-day { min-height: 112px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal-day.other { background: var(--surface-2); color: var(--text-3); }
.cal-day.today .cal-num { background: var(--accent); color: var(--accent-ink); }
.cal-num { font-size: 12px; font-weight: 600; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; }
.cal-item {
  font-size: 12px; padding: 3px 6px; border-radius: 4px; background: var(--surface-3); cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid var(--text-3);
}
.cal-item.agendado { border-left-color: var(--series-1); }
.cal-item.publicado { border-left-color: var(--good); }
.cal-item.em_producao, .cal-item.roteiro, .cal-item.aprovacao { border-left-color: var(--warning); }
.cal-item.ideia { border-left-color: var(--text-3); }
@media (max-width: 700px) {
  .cal { grid-template-columns: minmax(0, 1fr); }
  .cal-dow, .cal-day.other.empty-day { display: none; }
  .cal-day { min-height: 0; }
}

/* Lists */
.list { display: flex; flex-direction: column; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--surface-3); min-width: 0; }
.list-item:last-child { border-bottom: none; }
.list-item .grow { flex: 1; min-width: 0; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
.thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--surface-3); flex-shrink: 0; }

/* Charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .axis text { fill: var(--text-3); font-size: 11px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .baseline { stroke: var(--text-3); stroke-width: 1; }
.chart .crosshair { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tooltip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; z-index: 5; min-width: 120px; white-space: nowrap;
}
.tooltip .t-title { font-weight: 620; margin-bottom: 4px; }
.tooltip .t-row { display: flex; align-items: center; gap: 6px; }
.tooltip .t-row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.tooltip .t-row b { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(80px, 140px) 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar-track { height: 14px; position: relative; }
.hbar-fill { height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hbar:hover .hbar-fill { opacity: 0.85; }
.hbar .val { font-variant-numeric: tabular-nums; color: var(--text-2); min-width: 60px; text-align: right; }

.copy-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.copy-text { white-space: pre-wrap; font-size: 14px; line-height: 1.55; }
.tag-list { display: flex; gap: 6px; flex-wrap: wrap; }
.trend-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--surface-3); }
.trend-rank { width: 26px; height: 26px; border-radius: 6px; background: var(--surface-3); display: grid; place-items: center; font-size: 12px; font-weight: 650; flex-shrink: 0; }
.dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: 13px; }
.dl dt { color: var(--text-2); }
.dl dd { margin: 0; }
pre.log { white-space: pre-wrap; font-size: 12px; background: var(--surface-2); padding: 10px; border-radius: 6px; margin: 0; max-height: 240px; overflow: auto; }
.grow { flex: 1; min-width: 0; }
details summary { cursor: pointer; margin: 8px 0; }
.toolbar .input { width: auto; max-width: 100%; }
@media (max-width: 600px) { .toolbar { width: 100%; } .toolbar .input, .toolbar .search { flex: 1 1 160px; max-width: none; } }
.cal-dow-mobile { display: none; }
@media (max-width: 700px) { .cal-dow-mobile { display: inline; } }

    return db.prepare(`${baseSelect} WHERE ${alias}.id = ?`).get(id);

      params.push(String(req.query.to));

    const r = db
      .prepare(`INSERT INTO ${cfg.table} (${cols.join(', ')}) VALUES (${cols.map(() => '?').join(', ')})`)

const express = require('express');

function daysAgo(n, from = new Date()) {
  const d = new Date(from);
  d.setUTCDate(d.getUTCDate() - n);
  return localDate(d);
}

function range(req, defaultDays = 30) {
  const to = /^\d{4}-\d{2}-\d{2}$/.test(req.query.to || '') ? req.query.to : localDate();
  const from = /^\d{4}-\d{2}-\d{2}$/.test(req.query.from || '') ? req.query.from : daysAgo(defaultDays - 1);
  return { from, to };
}

const ratio = (a, b) => (b ? a / b : null);

// Performance per tag (a post with several tags counts in each of them).
function groupTags(rows) {
  const map = new Map();
  for (const r of rows) {
    for (const tag of String(r.tags || '').split(',').map((t) => t.trim().toLowerCase()).filter(Boolean)) {
      const g = map.get(tag) || { key: tag, posts: 0, interactions: 0, reach: 0 };
      g.posts++;
      g.interactions += r.interactions || 0;
      g.reach += r.reach || 0;
      map.set(tag, g);
    }
  }
  return [...map.values()].map((g) => ({ ...g, avg_interactions: g.interactions / g.posts })).sort((a, b) => b.avg_interactions - a.avg_interactions);
}

  router.get('/analytics/content', (req, res) => {
    const { from, to } = range(req, 90);
    const where = ["c.status = 'publicado'", 'c.published_at >= ?', "c.published_at < date(?, '+1 day')"];
    const params = [from, to];
    if (req.query.account_id) {
      where.push('c.account_id = ?');
      params.push(req.query.account_id);
    }
    const rows = db
      .prepare(
        `SELECT c.*, a.platform, a.handle AS account_handle, (c.likes+c.comments+c.shares+c.saves) AS interactions
         FROM contents c LEFT JOIN accounts a ON a.id = c.account_id WHERE ${where.join(' AND ')}`
      )
      .all(...params);

    const group = (keyFn) => {
      const map = new Map();
      for (const r of rows) {
        const k = keyFn(r);
        if (k == null) continue;
        const g = map.get(k) || { key: k, posts: 0, interactions: 0, reach: 0, views: 0, saves: 0, shares: 0 };
        g.posts++;
        g.interactions += r.interactions || 0;
        g.reach += r.reach || 0;
        g.views += r.views || 0;
        g.saves += r.saves || 0;
        g.shares += r.shares || 0;
        map.set(k, g);
      }
      return [...map.values()]
        .map((g) => ({ ...g, avg_interactions: g.interactions / g.posts, avg_reach: g.reach / g.posts, engagement_rate: ratio(g.interactions, g.reach) }))
        .sort((a, b) => b.avg_interactions - a.avg_interactions);
    };

    const WEEKDAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    const totals = rows.reduce(
      (t, r) => ({
        posts: t.posts + 1,
        interactions: t.interactions + (r.interactions || 0),
        reach: t.reach + (r.reach || 0),
        views: t.views + (r.views || 0),
        likes: t.likes + (r.likes || 0),
        comments: t.comments + (r.comments || 0),
        shares: t.shares + (r.shares || 0),
        saves: t.saves + (r.saves || 0),
      }),
      { posts: 0, interactions: 0, reach: 0, views: 0, likes: 0, comments: 0, shares: 0, saves: 0 }
    );
    const withRate = rows.map((r) => ({ ...r, engagement_rate: ratio(r.interactions, r.reach) }));
    res.json({
      from,
      to,
      totals: { ...totals, engagement_rate: ratio(totals.interactions, totals.reach), avg_interactions: ratio(totals.interactions, totals.posts) },
      by_type: group((r) => r.type),
      by_platform: group((r) => r.platform || 'sem conta'),
      by_weekday: group((r) => (r.published_at ? WEEKDAYS[new Date(`${r.published_at.slice(0, 10)}T12:00:00Z`).getUTCDay()] : null)),
      by_hour: group((r) => (r.published_at && r.published_at.length >= 13 ? `${r.published_at.slice(11, 13)}h` : null)).sort((a, b) =>
        a.key.localeCompare(b.key)
      ),
      by_tag: groupTags(rows),
      top: [...withRate].sort((a, b) => b.interactions - a.interactions).slice(0, 10),
      bottom: [...withRate].sort((a, b) => a.interactions - b.interactions).slice(0, 5),
    });
  });

      .all(from, to)
      .map((e) => ({ ...e, open_rate: ratio(e.opened, e.delivered), click_rate: ratio(e.clicked, e.delivered), ctor: ratio(e.clicked, e.opened), bounce_rate: ratio(e.bounced, e.sent) }));

    res.json({

      to,
      totals: {
        ...cur,
        visitor_to_lead: ratio(cur.leads, cur.visitors),
        lead_to_qualified: ratio(cur.qualified, cur.leads),
        qualified_to_opportunity: ratio(cur.opportunities, cur.qualified),
        opportunity_to_sale: ratio(cur.sales, cur.opportunities),
      },

      assets: db
        .prepare('SELECT * FROM rd_assets ORDER BY conversions DESC')

        .map((a) => ({ ...a, conversion_rate: ratio(a.conversions, a.visits) })),

  });

    const competitors = db.prepare('SELECT * FROM competitors ORDER BY name').all();

      .prepare(
        `SELECT gp.*, c.name AS competitor_name, c.comp_type, c.region FROM glass_prices gp JOIN competitors c ON c.id = gp.competitor_id
         WHERE gp.date = (SELECT MAX(date) FROM glass_prices x WHERE x.product_id = gp.product_id AND x.competitor_id = gp.competitor_id)`

      .prepare(

      db
        .prepare(
          `SELECT i.sku, SUM(i.quantity) AS units FROM store_order_items i JOIN store_orders o ON o.id = i.order_id
           WHERE o.status != 'cancelado' AND o.date >= date('now', '-30 day') AND i.sku IS NOT NULL GROUP BY i.sku`
        )
        .all()

      const s = [...xs].sort((a, b) => a - b);

      return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;

      const offers = latest.filter((o) => o.product_id === p.id).sort((a, b) => a.price - b.price);
      const prices = offers.map((o) => o.price);
      const mean = avg(prices);
      const min = prices.length ? prices[0] : null;
      const changes = offers.map((o) => prevKey.get(`${o.product_id}:${o.competitor_id}`)).filter((v) => v != null);
      const prevMean = changes.length === offers.length && offers.length ? avg(changes) : null;
      let status;
      if (p.our_price == null) status = 'lacuna';
      else if (!offers.length) status = 'sem_concorrente';
      else if (p.our_price <= min) status = 'mais_barato';
      else if (p.our_price / mean <= 1.05) status = 'competitivo';
      else status = 'acima';
      return {
        ...p,
        offers,
        offers_count: offers.length,
        min_price: min,
        max_price: prices.length ? prices[prices.length - 1] : null,
        avg_price: mean,
        median_price: median(prices),
        cheapest: offers[0] ? { competitor: offers[0].competitor_name, brand: offers[0].brand, price: offers[0].price } : null,
        price_index: p.our_price != null && mean ? p.our_price / mean : null,
        rank: p.our_price != null && offers.length ? 1 + offers.filter((o) => o.price < p.our_price).length : null,
        margin: p.our_price && p.our_cost != null ? (p.our_price - p.our_cost) / p.our_price : null,
        room: status === 'mais_barato' && min ? (min - p.our_price) / p.our_price : null,
        market_change: prevMean ? mean / prevMean - 1 : null,
        units_30d: p.sku ? units.get(p.sku) || 0 : null,
        status,
      };
    });

    const priced = rows.filter((r) => r.price_index != null);
    const categories = [...new Set(rows.map((r) => r.category))].map((cat) => {
      const rs = rows.filter((r) => r.category === cat);
      const pr = rs.filter((r) => r.price_index != null);
      return {
        key: cat,
        products: rs.length,
        offers: rs.reduce((s, r) => s + r.offers_count, 0),
        searches: rs.reduce((s, r) => s + (r.monthly_searches || 0), 0),
        avg_index: avg(pr.map((r) => r.price_index)),
        above: rs.filter((r) => r.status === 'acima').length,
        cheapest: rs.filter((r) => r.status === 'mais_barato').length,

      const vsUs = offers
        .map((o) => {
          const p = products.find((x) => x.id === o.product_id);
          return p?.our_price ? o.price / p.our_price : null;
        })
        .filter((v) => v != null);
      const covered = new Set(offers.map((o) => o.product_id)).size;

        id: c.id,
        name: c.name,
        comp_type: c.comp_type,
        region: c.region,
        website: c.website,
        price_position: c.price_position,
        brands: [...new Set(offers.map((o) => o.brand).filter(Boolean))].join(', ') || c.brands,
        products_covered: covered,
        coverage: products.length ? covered / products.length : null,
        index_vs_us: avg(vsUs),
        cheaper_than_us: vsUs.filter((v) => v < 1).length,
        pricier_than_us: vsUs.filter((v) => v > 1).length,
        in_stock_rate: offers.length ? offers.filter((o) => o.in_stock).length / offers.length : null,
        cheapest_count: rows.filter((r) => r.offers[0]?.competitor_id === c.id && (r.our_price == null || r.offers[0].price < r.our_price)).length,
        last_date: offers.reduce((m, o) => (o.date > m ? o.date : m), ''),
      };
    });

    const brandMap = new Map();
    for (const o of latest) {
      if (!o.brand) continue;
      const r = rows.find((x) => x.id === o.product_id);
      const b = brandMap.get(o.brand) || { key: o.brand, offers: 0, competitors: new Set(), rel: [] };
      b.offers++;
      b.competitors.add(o.competitor_name);
      if (r?.avg_price) b.rel.push(o.price / r.avg_price);
      brandMap.set(o.brand, b);
    }
    const brands = [...brandMap.values()]
      .map((b) => ({ key: b.key, offers: b.offers, competitors: [...b.competitors].join(', '), rel_price: avg(b.rel) }))
      .sort((a, b) => b.offers - a.offers);

    const lastDate = latest.reduce((m, o) => (o.date > m ? o.date : m), '');
    res.json({
      totals: {
        products: rows.length,
        sold: rows.filter((r) => r.our_price != null).length,
        offers: latest.length,
        competitors: comps.filter((c) => c.products_covered).length,
        avg_index: avg(priced.map((r) => r.price_index)),
        cheapest_share: priced.length ? rows.filter((r) => r.status === 'mais_barato').length / priced.length : null,
        above: rows.filter((r) => r.status === 'acima').length,
        gaps: rows.filter((r) => r.status === 'lacuna').length,
        last_date: lastDate || null,
      },
      products: rows,
      categories: categories.sort((a, b) => b.searches - a.searches),
      competitors: comps.sort((a, b) => b.products_covered - a.products_covered),
      brands,
      opportunities: {
        gaps: rows.filter((r) => r.status === 'lacuna' && r.offers_count).sort((a, b) => (b.monthly_searches || 0) - (a.monthly_searches || 0)),
        above: rows.filter((r) => r.status === 'acima').sort((a, b) => (b.monthly_searches || 0) * (b.price_index - 1) - (a.monthly_searches || 0) * (a.price_index - 1)),
        room: rows.filter((r) => r.room != null && r.room >= 0.06).sort((a, b) => b.room - a.room),
        stockout: rows.filter((r) => r.our_price != null && r.stock != null && r.stock <= 3).sort((a, b) => (b.monthly_searches || 0) - (a.monthly_searches || 0)),
      },
    });
  });

  router.get('/glass_products/:id/history', (req, res) => {
    res.json(
      db
        .prepare(
          `SELECT gp.date, gp.price, gp.brand, gp.in_stock, c.name AS competitor_name FROM glass_prices gp JOIN competitors c ON c.id = gp.competitor_id
           WHERE gp.product_id = ? ORDER BY gp.date`
        )
        .all(req.params.id)
    );
  });

  // Price collection for one competitor, many products at once.
  router.post('/glass_prices/batch', canWrite, (req, res) => {
    const b = req.body || {};
    if (!b.competitor_id || !/^\d{4}-\d{2}-\d{2}$/.test(b.date || '')) return res.status(400).json({ error: 'Concorrente e data são obrigatórios.' });
    const stmt = db.prepare(
      `INSERT INTO glass_prices (product_id, competitor_id, brand, price, in_stock, url, date, source) VALUES (?, ?, ?, ?, ?, ?, ?, 'manual')
       ON CONFLICT (product_id, competitor_id, date) DO UPDATE SET brand = excluded.brand, price = excluded.price, in_stock = excluded.in_stock, url = COALESCE(excluded.url, glass_prices.url)`
    );
    let n = 0;
    for (const it of Array.isArray(b.items) ? b.items : []) {
      const price = Number(it.price);
      if (!it.product_id || !Number.isFinite(price) || price <= 0) continue;
      stmt.run(Number(it.product_id), Number(b.competitor_id), it.brand || null, price, it.in_stock === false ? 0 : 1, it.url || null, b.date);
      n++;
    }
    res.status(201).json({ ok: true, saved: n });
  });

  // CSV-like import: [{ produto|sku, concorrente, marca, preco, url, estoque, data }]
  router.post('/glass_prices/import', canWrite, (req, res) => {
    const rows = Array.isArray(req.body?.rows) ? req.body.rows.slice(0, 5000) : [];
    const products = db.prepare('SELECT id, name, sku FROM glass_products').all();
    const comps = db.prepare('SELECT id, name FROM competitors').all();
    const norm = (s) => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const stmt = db.prepare(
      `INSERT INTO glass_prices (product_id, competitor_id, brand, price, in_stock, url, date, source) VALUES (?, ?, ?, ?, ?, ?, ?, 'importado')
       ON CONFLICT (product_id, competitor_id, date) DO UPDATE SET brand = excluded.brand, price = excluded.price, in_stock = excluded.in_stock, url = COALESCE(excluded.url, glass_prices.url)`
    );
    let saved = 0;
    const skipped = [];
    rows.forEach((r, i) => {
      const p = products.find((x) => (r.sku && norm(x.sku) === norm(r.sku)) || norm(x.name) === norm(r.produto));
      const c = comps.find((x) => norm(x.name) === norm(r.concorrente));
      const price = Number(String(r.preco ?? '').replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.'));
      const date = /^\d{4}-\d{2}-\d{2}$/.test(r.data || '') ? r.data : localDate();
      if (!p) return skipped.push(`linha ${i + 2}: produto "${r.produto || r.sku || ''}" não cadastrado`);
      if (!c) return skipped.push(`linha ${i + 2}: concorrente "${r.concorrente || ''}" não cadastrado`);
      if (!Number.isFinite(price) || price <= 0) return skipped.push(`linha ${i + 2}: preço inválido`);
      stmt.run(p.id, c.id, r.marca || null, price, /^(n|nao|não|0|false|esgotado)$/i.test(String(r.estoque ?? '').trim()) ? 0 : 1, r.url || null, date);
      saved++;
    });
    res.status(201).json({ ok: true, saved, skipped: skipped.slice(0, 50), skipped_count: skipped.length });
  });

  // ---------- Settings ----------
  router.put('/settings/brand_voice', adminOnly, (req, res) => {
    const value = String(req.body?.value || '').slice(0, 8000);
    db.prepare(
      "INSERT INTO settings (key, value) VALUES ('brand_voice', ?) ON CONFLICT (key) DO UPDATE SET value = excluded.value, updated_at = datetime('now')"
    ).run(value);
    res.json({ ok: true });
  });

  return router;
}

module.exports = { createAnalytics };

'use strict';

const express = require('express');
const Anthropic = require('@anthropic-ai/sdk');

const MODEL = process.env.COPY_MODEL || 'claude-opus-5-5';

const FORMATS = {
  legenda_instagram: 'Legenda de post para o Instagram (feed/carrossel)',
  roteiro_reels: 'Roteiro curto de Reels/TikTok (gancho nos 3 primeiros segundos, cenas e fala)',
  sequencia_stories: 'Sequência de 3 a 6 stories com texto de cada tela e CTA final',
  anuncio_meta: 'Anúncio Meta Ads (texto principal, título e descrição)',
  anuncio_google: 'Anúncio Google Ads de pesquisa (títulos de até 30 caracteres e descrições de até 90)',
  titulo_seo_produto: 'Título e meta description SEO para página de produto na loja Tray',
  ficha_tecnica: 'Descrição técnica de produto para a loja (especificações, aplicações, normas e cuidados)',
  email_marketing: 'E-mail para o RD Station Marketing (assunto, pré-cabeçalho e corpo)',
  resposta_orcamento: 'Resposta a pedido de orçamento B2B (empresas, universidades e órgãos públicos)',
  whatsapp: 'Mensagem de WhatsApp para lista de clientes',
  briefing_influenciador: 'Briefing para professor/influenciador (mensagens-chave, obrigatórios, proibidos e CTA)',
  lancamento: 'Copy de lançamento de linha de produtos (teaser, revelação e chamada)',
};

const DEFAULT_BRAND_VOICE = `Marca: InoveLabor — produtos para laboratórios (vidrarias, equipamentos, consumíveis, porcelanas e kits educativos), com loja online e atendimento para todo o Brasil.
Público: compradores de laboratórios, técnicos, pesquisadores, professores e coordenadores de escolas e universidades.
Escreva em português do Brasil, com voz técnica, confiável e clara. Cite especificações (material, capacidade, classe de precisão) quando fizer sentido.
Evite exageros, promessas de desempenho que não podem ser comprovadas e jargão sem explicação.
Destaque benefícios práticos: precisão, durabilidade, disponibilidade em estoque, entrega rápida, nota fiscal e boleto faturado para empresas e instituições.`;

  type: 'object',
  properties: {
    variations: {
      type: 'array',
      items: {
        type: 'object',
        properties: {
          title: { type: 'string', description: 'Nome curto da abordagem ou título/assunto, quando o formato pedir' },
          text: { type: 'string', description: 'A copy completa, pronta para uso' },
          hashtags: { type: 'array', items: { type: 'string' } },
          cta: { type: 'string' },
          notes: { type: 'string', description: 'Por que esta versão funciona, em uma frase' },
        },
        required: ['title', 'text', 'hashtags', 'cta', 'notes'],
        additionalProperties: false,

function getSetting(db, key, fallback = null) {
  const row = db.prepare('SELECT value FROM settings WHERE key = ?').get(key);

function buildPrompt(input, context) {
  const lines = [
    `Formato: ${FORMATS[input.format]}`,
    `Tema / produto: ${input.topic}`,
    input.objective && `Objetivo: ${input.objective}`,
    input.audience && `Público: ${input.audience}`,
    input.tone && `Tom desejado: ${input.tone}`,
    input.keywords && `Palavras-chave para incluir naturalmente: ${input.keywords}`,
    input.brief && `Contexto adicional:\n${input.brief}`,
    context.launch &&
      `Lançamento relacionado: ${context.launch.name}${context.launch.launch_date ? ` (data: ${context.launch.launch_date})` : ''}${

      .prepare(

         LEFT JOIN users u ON u.id = c.created_by LEFT JOIN launches l ON l.id = c.launch_id
         ${req.query.favorite ? 'WHERE c.favorite = 1' : ''} ORDER BY c.id DESC LIMIT 200`
      )
      .all();
    res.json(rows.map((r) => ({ ...r, variations: JSON.parse(r.variations) })));
  });

  router.post('/generate', canWrite, async (req, res, next) => {
    try {
      const b = req.body || {};
      const input = {
        format: String(b.format || ''),
        topic: String(b.topic || '').trim().slice(0, 500),
        objective: String(b.objective || '').trim().slice(0, 300),
        audience: String(b.audience || '').trim().slice(0, 300),
        tone: String(b.tone || '').trim().slice(0, 200),
        keywords: String(b.keywords || '').trim().slice(0, 500),
        brief: String(b.brief || '').trim().slice(0, 4000),
        launch_id: b.launch_id ? Number(b.launch_id) : null,
        count: Math.min(Math.max(Number(b.count) || 3, 1), 5),
      };
      if (!FORMATS[input.format]) return res.status(400).json({ error: 'Formato inválido.' });
      if (!input.topic) return res.status(400).json({ error: 'Informe o tema ou produto.' });

      const context = {
        launch: input.launch_id ? db.prepare('SELECT * FROM launches WHERE id = ?').get(input.launch_id) : null,
        topContents: db
          .prepare(
            `SELECT title, type FROM contents WHERE status = 'publicado' AND published_at >= date('now', '-90 day')
             ORDER BY (COALESCE(likes,0)+COALESCE(comments,0)+COALESCE(shares,0)+COALESCE(saves,0)) DESC LIMIT 5`
          )
          .all(),

      const brandVoice = getSetting(db, 'brand_voice', DEFAULT_BRAND_VOICE);
      const system = `Você é o copywriter sênior da equipe de marketing da InoveLabor. Escreva copys prontas para publicar.\n\nGuia de voz da marca:\n${brandVoice}`;

      const response = await getClient().beta.messages.create({
        model: MODEL,
        max_tokens: 16000,
        betas: ['server-side-fallback-2026-07-01'],
        fallbacks: 'default',
        output_config: { effort: 'medium', format: { type: 'json_schema', schema: OUTPUT_SCHEMA } },
        system,

      });

      if (response.stop_reason === 'refusal') {
        return res.status(422).json({ error: 'O pedido não pôde ser atendido. Reformule o briefing e tente novamente.' });
      }
      if (response.stop_reason === 'max_tokens') {
        return res.status(502).json({ error: 'A resposta ficou longa demais. Peça menos variações.' });

        return res.status(502).json({ error: 'Resposta inesperada do gerador. Tente novamente.' });
      }

      const r = db
        .prepare(
          `INSERT INTO copies (format, objective, topic, audience, tone, keywords, brief, launch_id, variations, model, created_by)

          input.format,
          input.objective || null,
          input.topic,
          input.audience || null,
          input.tone || null,
          input.keywords || null,
          input.brief || null,
          input.launch_id,

          response.model,
          req.user.id
        );
      res.status(201).json({ id: r.lastInsertRowid, variations: parsed.variations || [] });
    } catch (err) {
      if (err instanceof Anthropic.AuthenticationError) {
        err.status = 503;
        err.message = 'Chave da API do Claude inválida. Verifique ANTHROPIC_API_KEY.';
      } else if (err instanceof Anthropic.RateLimitError) {
        err.status = 429;
        err.message = 'Limite de uso do gerador atingido. Aguarde um pouco e tente novamente.';
      } else if (err instanceof Anthropic.APIError) {
        console.error('Falha no gerador de copys:', err.status, err.message);
        err.message = `Falha no gerador de copys (${err.status ?? 'erro'}). Tente novamente.`;
        err.status = 502;
      }
      next(err);
    }
  });

  router.patch('/:id', canWrite, (req, res) => {
    db.prepare('UPDATE copies SET favorite = ? WHERE id = ?').run(req.body?.favorite ? 1 : 0, req.params.id);
    res.json({ ok: true });
  });

  router.delete('/:id', canWrite, (req, res) => {
    db.prepare('DELETE FROM copies WHERE id = ?').run(req.params.id);
    res.json({ ok: true });
  });

  return router;
}

module.exports = { createCopywriter, FORMATS, DEFAULT_BRAND_VOICE, getSetting };

});

    for (const [v, w] of pairs) if ((r -= w) <= 0) return v;

  const u = new URL(`${base(ctx.config)}${path}`);
  for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
  u.searchParams.set('access_token', token);
  return httpJson(ctx.fetch, u.toString());
}

// Tray paginates with ?page=N&limit=50 and wraps each record ({ Orders: [{ Order: {...} }] }).
async function* pages(ctx, path, listKey, itemKey, params = {}) {
  for (let page = 1; ; page++) {
    const r = await api(ctx, path, { ...params, limit: 50, page });
    const list = (r[listKey] || []).map((x) => x[itemKey] || x);
    for (const it of list) yield it;
    const total = num(r.paging?.total);
    if (!list.length || page * 50 >= total) break;
  }
}

const STATUS_MAP = [
  [/cancel/i, 'cancelado'],
  [/aguardando pagamento|a enviar.*pagamento|pendente/i, 'aguardando_pagamento'],
  [/enviado|transporte|a caminho/i, 'enviado'],
  [/entregue|finalizado|conclu/i, 'finalizado'],
  [/separa|produ|a enviar|aprovado|pago/i, 'em_separacao'],

function mapStatus(s) {
  const found = STATUS_MAP.find(([re]) => re.test(String(s || '')));
  return found ? found[1] : String(s || 'outro').toLowerCase();
}
function mapPayment(p) {
  const s = String(p || '').toLowerCase();
  if (s.includes('pix')) return 'pix';
  if (s.includes('faturad')) return 'boleto_faturado';
  if (s.includes('boleto')) return 'boleto';
  if (s.includes('cart') || s.includes('credit')) return 'cartao';
  return s || 'outro';

async function syncOrders(ctx) {
  const { db } = ctx;
  const since = lastDays(ctx.full ? 120 : 10, { includeToday: true })[0];
  const upsert = db.prepare(`
    INSERT INTO store_orders (external_id, date, status, total, shipping, discount, items, state, customer_type, customer_external_id, payment, coupon, source)
    VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 'api')
    ON CONFLICT (external_id) DO UPDATE SET status = excluded.status, total = excluded.total, shipping = excluded.shipping,
      discount = excluded.discount, payment = excluded.payment
    RETURNING id, (SELECT COUNT(*) FROM store_order_items WHERE order_id = store_orders.id) AS n_items`);
  const addItem = db.prepare('INSERT INTO store_order_items (order_id, product_external_id, sku, name, quantity, price) VALUES (?, ?, ?, ?, ?, ?)');
  let n = 0;
  let detailed = 0;
  for await (const o of pages(ctx, '/orders', 'Orders', 'Order', { modified: since, sort: 'id_desc' })) {
    const customer = o.Customer || {};
    const doc = String(customer.cnpj || customer.cpf || '').replace(/\D/g, '');
    const row = upsert.get(
      String(o.id), String(o.date || localDate()).slice(0, 10), mapStatus(o.status), num(o.total), num(o.shipment_value), num(o.discount),
      num(o.products_quantity) || null, customer.state || o.state || null, doc.length === 14 || customer.type === '1' ? 'pj' : 'pf',
      o.customer_id ? String(o.customer_id) : null, mapPayment(o.payment_form), o.discount_coupon || null
    );
    n++;
    // Items only come with the complete order; fetch once per new order (Tray allows ~180 requests/min).
    if (!row.n_items) {
      try {
        const full = await api(ctx, `/orders/${o.id}/complete`);
        const sold = full.Order?.ProductsSold || [];
        for (const ps of sold) {
          const p = ps.ProductsSold || ps;
          addItem.run(row.id, p.product_id ? String(p.product_id) : null, p.reference || null, p.name || 'Produto', num(p.quantity) || 1, num(p.price));
        }
        detailed++;
      } catch (err) {
        ctx.log(`Pedido ${o.id}: ${err.message}`);
      }
    }
  }
  return `${n} pedidos (${detailed} detalhados)`;
}

async function syncProducts(ctx) {
  const { db } = ctx;
  const upsert = db.prepare(`
    INSERT INTO store_products (external_id, name, sku, category, price, stock, active, url, updated_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?, datetime('now'))
    ON CONFLICT (external_id) DO UPDATE SET name = excluded.name, sku = excluded.sku, category = excluded.category, price = excluded.price,
      stock = excluded.stock, active = excluded.active, url = excluded.url, updated_at = excluded.updated_at`);
  let n = 0;
  for await (const p of pages(ctx, '/products', 'Products', 'Product')) {
    upsert.run(String(p.id), p.name, p.reference || null, p.category_name || p.Category?.name || null, num(p.promotional_price) || num(p.price), num(p.stock),
      String(p.available) === '0' ? 0 : 1, p.url?.https || p.url?.http || null);
    n++;
  }
  // Keep the glassware map in sync: same SKU → our current price and stock come from the store.
  const linked = db.prepare(
    `UPDATE glass_products SET our_price = (SELECT price FROM store_products s WHERE s.sku = glass_products.sku),
       stock = (SELECT stock FROM store_products s WHERE s.sku = glass_products.sku)
     WHERE sku IS NOT NULL AND EXISTS (SELECT 1 FROM store_products s WHERE s.sku = glass_products.sku)`
  ).run().changes;
  return `${n} produtos (${linked} vinculados ao mapa de vidrarias)`;
}

async function syncCarts(ctx) {
  const upsert = ctx.db.prepare(`
    INSERT INTO store_carts (external_id, date, total, recovered) VALUES (?, ?, ?, ?)
    ON CONFLICT (external_id) DO UPDATE SET total = excluded.total, recovered = excluded.recovered`);
  let n = 0;
  for await (const c of pages(ctx, '/carts', 'Carts', 'Cart')) {
    upsert.run(String(c.session_id || c.id), String(c.date || localDate()).slice(0, 10), num(c.total) || num(c.price) * (num(c.quantity) || 1), c.order_id ? 1 : 0);
    n++;
  }
  return `${n} carrinhos`;
}

// Best sellers of the last 30 days feed the "Trends" page.
function syncBestSellers(ctx) {
  const today = localDate();
  const rows = ctx.db
    .prepare(
      `SELECT i.name, SUM(i.quantity) AS units FROM store_order_items i JOIN store_orders o ON o.id = i.order_id
       WHERE o.status != 'cancelado' AND o.date >= date('now', '-30 day') GROUP BY COALESCE(i.sku, i.name) ORDER BY units DESC LIMIT 20`
    )
    .all();
  const stmt = ctx.db.prepare(`
    INSERT INTO trends (source, term, rank, traffic, fetched_date) VALUES ('tray', ?, ?, ?, ?)
    ON CONFLICT (source, term, fetched_date) DO UPDATE SET rank = excluded.rank, traffic = excluded.traffic`);
  rows.forEach((r, i) => stmt.run(r.name, i + 1, `${r.units} un.`, today));
  return `${rows.length} mais vendidos`;
}

async function sync(ctx) {
  const parts = [];
  for (const [labelText, fn] of [
    ['Pedidos', syncOrders],
    ['Produtos', syncProducts],
    ['Carrinhos', syncCarts],
    ['Mais vendidos', syncBestSellers],
  ]) {
    try {
      parts.push(`${labelText}: ${await fn(ctx)}`);
    } catch (err) {
      ctx.log(`${labelText}: ${err.message}`);
      parts.push(`${labelText}: falhou (${err.message})`);
      if (/não conectada/.test(err.message)) throw err;
    }
  }
  return parts.join(' · ');
}

module.exports = { label: 'Tray', fields, oauth: true, test, sync, authUrl, exchangeCode };

function tokenFields(t) {

    refresh_token: t.refresh_token,
    token_expires_at: new Date(Date.now() + (num(t.expires_in) - 300) * 1000).toISOString(),

async function exchangeCode(fetchImpl, config, code) {

    method: 'POST',
    body: { client_id: config.client_id, client_secret: config.client_secret, code },
  });
  return tokenFields(t);
}

// Access tokens last 24h.
async function ensureToken(ctx) {
  const c = ctx.config;
  if (c.access_token && c.token_expires_at && c.token_expires_at > new Date().toISOString()) return c.access_token;

    })
  );

  Object.assign(c, updated);
  return c.access_token;

// Route the front-end's fetch('/api/...') calls to the in-browser server.
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init = {}) => {
  const url = typeof input === 'string' ? input : input.url;
  if (!url.startsWith('/api/')) return realFetch(input, init);
  const api = await ready;
  const u = new URL(url, 'http://demo.local');
  const req = {
    method: (init.method || 'GET').toUpperCase(),
    query: Object.fromEntries(u.searchParams),
    body: init.body ? JSON.parse(init.body) : {},
    params: {},
    headers: {},
    get: () => undefined,
  };
  const res = {
    statusCode: 200, body: null, finished: false,
    status(c) { this.statusCode = c; return this; },
    json(b) { this.body = b; this.finished = true; return this; },
    setHeader() {}, append() {},
    redirect() { this.finished = true; },
  };
  try {
    const handled = await api.handle(req, res, u.pathname.slice(4));
    if (!handled && !res.finished) res.status(404).json({ error: 'Rota não encontrada.' });
  } catch (err) {
    const status = err.status || 500;
    if (status >= 500) console.error(err);
    const message = String(err.message).includes('FOREIGN KEY') ? 'Registro relacionado não encontrado.' : status === 500 ? 'Erro interno do servidor.' : err.message;
    res.status(String(err.message).includes('FOREIGN KEY') ? 400 : status).json({ error: message, ...(err.code ? { code: err.code } : {}) });
  }
  const text = JSON.stringify(res.body);
  return { ok: res.statusCode < 400, status: res.statusCode, text: async () => text };
};

// ---------- DOM ----------
function h(tag, attrs = {}, ...children) {
  const svgTags = ['svg', 'path', 'line', 'rect', 'circle', 'g', 'text', 'polyline', 'polygon', 'title'];
  const el = svgTags.includes(tag) ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k === 'value' && 'value' in el && !(el instanceof SVGElement)) el.value = v;
    else if (k === 'checked' || k === 'selected' || k === 'disabled') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  append(el, children);
  return el;
}
function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}
function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
  return el;
}

// ---------- API ----------
class ApiError extends Error {
  constructor(message, status, data) {
    super(message);
    this.status = status;
    this.data = data;
  }
}
let onAuthLost = () => {};
function setAuthHandler(fn) {
  onAuthLost = fn;
}
async function api(method, path, body) {
  const res = await fetch(`/api${path}`, {
    method,
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'il-app' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data = null;
  const text = await res.text();
  try {
    data = text ? JSON.parse(text) : null;
  } catch {
    data = null;
  }
  if (!res.ok) {
    if ((res.status === 401 && data?.code === 'unauthenticated') || data?.code === 'password_change_required') onAuthLost(data?.code);
    throw new ApiError(data?.error || `Erro ${res.status}`, res.status, data);
  }
  return data;
}
api.get = (p) => api('GET', p);
api.post = (p, b) => api('POST', p, b ?? {});
api.put = (p, b) => api('PUT', p, b ?? {});
api.patch = (p, b) => api('PATCH', p, b ?? {});
api.del = (p) => api('DELETE', p);

function qs(params) {
  const s = new URLSearchParams();
  for (const [k, v] of Object.entries(params)) if (v !== '' && v != null) s.set(k, v);
  const str = s.toString();
  return str ? `?${str}` : '';
}

// ---------- Formatting ----------
const nf = new Intl.NumberFormat('pt-BR');
const nf1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const cf = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const cf0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const compactF = new Intl.NumberFormat('pt-BR', { notation: 'compact', maximumFractionDigits: 1 });
const fmt = {
  n: (v) => (v == null || Number.isNaN(v) ? '—' : nf.format(Math.round(v))),
  n1: (v) => (v == null || Number.isNaN(v) ? '—' : nf1.format(v)),
  compact: (v) => (v == null ? '—' : Math.abs(v) < 10000 ? nf.format(Math.round(v)) : compactF.format(v)),
  money: (v) => (v == null ? '—' : cf.format(v)),
  money0: (v) => (v == null ? '—' : cf0.format(v)),
  pct: (v, d = 1) => (v == null || !Number.isFinite(v) ? '—' : `${(v * 100).toLocaleString('pt-BR', { maximumFractionDigits: d, minimumFractionDigits: d })}%`),
  x: (v) => (v == null || !Number.isFinite(v) ? '—' : `${nf1.format(v)}x`),
  date: (s) => {
    if (!s) return '—';
    const [y, m, d] = String(s).slice(0, 10).split('-');
    return `${d}/${m}/${y}`;
  },
  dateShort: (s) => {
    if (!s) return '—';
    const [, m, d] = String(s).slice(0, 10).split('-');
    return `${d}/${m}`;
  },
  datetime: (s) => {
    if (!s) return '—';
    const str = String(s);
    const time = str.length >= 16 ? ` ${str.slice(11, 16)}` : '';
    return fmt.date(str) + time;
  },
  utc: (s) => (s ? new Date(s.includes('T') ? s : `${s.replace(' ', 'T')}Z`).toLocaleString('pt-BR') : '—'),
  initials: (name) => String(name || '?').split(' ').filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join(''),
};

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function addDays(dateStr, n) {
  const d = new Date(`${dateStr}T12:00:00`);
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function delta(current, previous, { invert = false } = {}) {
  if (current == null || previous == null || previous === 0) return null;
  const pct = (current - previous) / Math.abs(previous);
  const up = pct >= 0;
  const good = invert ? !up : up;
  return h('span', { class: `delta ${good ? 'up' : 'down'}` }, `${up ? '▲' : '▼'} ${fmt.pct(Math.abs(pct))}`);
}

function stat(labelText, value, foot) {
  return h('div', { class: 'card stat' }, h('span', { class: 'stat-label' }, labelText), h('span', { class: 'stat-value' }, value), foot ? h('div', { class: 'stat-foot' }, foot) : null);
}

// ---------- Feedback ----------
function toast(message, type = 'ok') {
  let box = document.querySelector('.toasts');
  if (!box) {
    box = h('div', { class: 'toasts', role: 'status', 'aria-live': 'polite' });
    document.body.append(box);
  }
  const t = h('div', { class: `toast ${type === 'error' ? 'error' : ''}` }, message);
  box.append(t);
  setTimeout(() => t.remove(), type === 'error' ? 6000 : 3500);
}

function modal({ title, body, actions = [], wide = false, onClose }) {
  const prev = document.activeElement;
  const close = () => {
    backdrop.remove();
    document.removeEventListener('keydown', onKey);
    onClose?.();
    prev?.focus?.();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') close();
  };
  const dialog = h(
    'div',
    { class: `modal ${wide ? 'wide' : ''}`, role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('div', { class: 'modal-head' }, h('h2', {}, title), h('span', { class: 'spacer' }), h('button', { class: 'btn ghost icon', 'aria-label': 'Fechar', onclick: close }, '✕')),
    h('div', { class: 'modal-body' }, body),
    actions.length ? h('div', { class: 'modal-foot' }, actions) : null
  );
  const backdrop = h('div', { class: 'modal-backdrop', onmousedown: (e) => e.target === backdrop && close() }, dialog);
  document.body.append(backdrop);
  document.addEventListener('keydown', onKey);
  setTimeout(() => dialog.querySelector('input, select, textarea, button.primary')?.focus(), 0);
  return { close, dialog };
}

function confirmDialog(message, { okText = 'Confirmar', danger = true } = {}) {
  return new Promise((resolve) => {
    let done = false;
    const m = modal({
      title: 'Confirmar',
      body: h('p', {}, message),
      onClose: () => !done && resolve(false),
      actions: [
        h('button', { class: 'btn', onclick: () => m.close() }, 'Cancelar'),
        h('button', { class: `btn primary ${danger ? '' : ''}`, onclick: () => { done = true; m.close(); resolve(true); } }, okText),
      ],
    });
  });
}

// ---------- Forms ----------
// field: { name, label, type, options:[[value,label]]|enumName, required, placeholder, help, full, step, min, max }
function buildField(f, value, enums = {}) {
  const id = `f_${f.name}_${Math.random().toString(36).slice(2, 7)}`;
  let input;
  const common = { id, name: f.name, class: 'input', required: f.required, placeholder: f.placeholder || '' };
  if (f.type === 'textarea') input = h('textarea', { ...common, rows: f.rows || 4 }, value ?? '');
  else if (f.type === 'select') {
    const opts = typeof f.options === 'string' ? (enums[f.options] || []).map((v) => [v, label(v)]) : f.options || [];
    input = h(
      'select',
      common,
      f.required ? null : h('option', { value: '' }, f.emptyLabel || '—'),
      opts.map(([v, l]) => h('option', { value: v, selected: String(value ?? f.default ?? '') === String(v) }, l))
    );
  } else if (f.type === 'checkbox') {
    input = h('input', { id, name: f.name, type: 'checkbox', checked: !!value });
    return h('div', { class: `field ${f.full ? 'full' : ''}` }, h('label', { class: 'check', for: id }, input, f.label));
  } else {
    const type = { datetime: 'datetime-local', money: 'number' }[f.type] || f.type || 'text';
    let v = value ?? f.default ?? '';
    if (f.type === 'datetime' && v) v = String(v).slice(0, 16);
    input = h('input', { ...common, type, value: v, step: f.step ?? (f.type === 'money' ? '0.01' : f.type === 'number' ? 'any' : null), min: f.min, max: f.max, autocomplete: f.autocomplete || 'off' });
  }
  return h(
    'div',
    { class: `field ${f.full || f.type === 'textarea' ? 'full' : ''}` },
    h('label', { for: id }, f.label, f.required ? ' *' : ''),
    input,
    f.help ? h('span', { class: 'help' }, f.help) : null
  );
}

function readForm(form, fields) {
  const out = {};
  for (const f of fields) {
    const el = form.elements[f.name];
    if (!el) continue;
    if (f.type === 'checkbox') out[f.name] = el.checked;
    else if (['number', 'money'].includes(f.type)) out[f.name] = el.value === '' ? null : Number(el.value);
    else out[f.name] = el.value === '' ? null : el.value;
  }
  return out;
}

function formModal({ title, fields, values = {}, enums = {}, submitText = 'Salvar', onSubmit, onDelete, wide = false, extra }) {
  const error = h('div', { class: 'alert error hidden', role: 'alert' });
  const form = h('form', { class: 'form-grid', novalidate: false }, fields.map((f) => buildField(f, values[f.name], enums)), extra || null);
  const submitBtn = h('button', { class: 'btn primary', type: 'submit' }, submitText);
  form.append(h('button', { type: 'submit', class: 'hidden', tabindex: '-1' }));
  const actions = [];
  if (onDelete) {
    actions.push(
      h('button', {
        class: 'btn danger',
        type: 'button',
        onclick: async () => {
          if (!(await confirmDialog('Excluir este registro? Esta ação não pode ser desfeita.', { okText: 'Excluir' }))) return;
          try {
            await onDelete();
            m.close();
          } catch (err) {
            showError(err);
          }
        },
      }, 'Excluir'),
      h('span', { class: 'spacer' })
    );
  }
  actions.push(h('button', { class: 'btn', type: 'button', onclick: () => m.close() }, 'Cancelar'), submitBtn);
  submitBtn.addEventListener('click', () => form.requestSubmit());
  function showError(err) {
    error.textContent = err.message;
    error.classList.remove('hidden');
  }
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    submitBtn.disabled = true;
    error.classList.add('hidden');
    try {
      await onSubmit(readForm(form, fields), form);
      m.close();
    } catch (err) {
      showError(err);
    } finally {
      submitBtn.disabled = false;
    }
  });
  const m = modal({ title, body: h('div', { class: 'stack' }, error, form), actions, wide });
  return m;
}

// ---------- Table ----------
// columns: { label, key, value(row) (for sort), render(row) -> node|string, align, sortable=true }
function table({ columns, rows, onRowClick, empty = 'Nada por aqui ainda.', initialSort }) {
  let sort = initialSort || null;
  const wrap = h('div', { class: 'table-wrap' });
  function valueOf(col, row) {
    return col.value ? col.value(row) : row[col.key];
  }
  function draw() {
    clear(wrap);
    if (!rows.length) {
      wrap.append(h('div', { class: 'empty' }, empty));
      return;
    }
    let data = rows;
    if (sort) {
      const col = columns[sort.index];
      data = [...rows].sort((a, b) => {
        const va = valueOf(col, a);
        const vb = valueOf(col, b);
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        const r = typeof va === 'number' && typeof vb === 'number' ? va - vb : String(va).localeCompare(String(vb), 'pt-BR');
        return sort.dir === 'asc' ? r : -r;
      });
    }
    const thead = h(
      'thead',
      {},
      h(
        'tr',
        {},
        columns.map((c, i) =>
          h(
            'th',
            {
              class: `${c.align === 'right' ? 'right' : ''} ${c.sortable === false ? '' : 'sortable'}`,
              onclick: c.sortable === false ? null : () => {
                sort = sort?.index === i ? { index: i, dir: sort.dir === 'asc' ? 'desc' : 'asc' } : { index: i, dir: c.align === 'right' ? 'desc' : 'asc' };
                draw();
              },
              'aria-sort': sort?.index === i ? (sort.dir === 'asc' ? 'ascending' : 'descending') : null,
            },
            c.label,
            sort?.index === i ? (sort.dir === 'asc' ? ' ↑' : ' ↓') : ''
          )
        )
      )
    );
    const tbody = h(
      'tbody',
      {},
      data.map((row) =>
        h(
          'tr',
          {
            class: onRowClick ? 'clickable' : '',
            onclick: onRowClick ? (e) => !e.target.closest('a, button') && onRowClick(row) : null,
            tabindex: onRowClick ? '0' : null,
            onkeydown: onRowClick ? (e) => e.key === 'Enter' && onRowClick(row) : null,
          },
          columns.map((c) => {
            const v = c.render ? c.render(row) : row[c.key];
            return h('td', { class: `${c.align === 'right' ? 'right num' : ''} ${c.truncate ? 'truncate' : ''}`, title: c.truncate && typeof v === 'string' ? v : null }, v ?? '—');
          })
        )
      )
    );
    wrap.append(h('table', { class: 'table' }, thead, tbody));
  }
  draw();
  return wrap;
}

function tabs(items, onChange, active = items[0][0]) {
  const bar = h('div', { class: 'tabs', role: 'tablist' });
  function draw() {
    clear(bar);
    for (const [key, text] of items) {
      bar.append(h('button', { class: key === active ? 'active' : '', role: 'tab', 'aria-selected': key === active ? 'true' : 'false', onclick: () => { active = key; draw(); onChange(key); } }, text));
    }
  }
  draw();
  return bar;
}

function debounce(fn, ms = 250) {
  let t;
  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), ms);
  };
}

function loading() {
  return h('div', { class: 'empty' }, 'Carregando…');
}

function errorBox(err) {
  return h('div', { class: 'alert error', role: 'alert' }, err.message || String(err));
}

// ---------- Charts (SVG) ----------
const SERIES = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)', 'var(--series-4)'];
const seriesColor = (i) => SERIES[i % SERIES.length];

function niceMax(v) {
  if (v <= 0) return 1;
  const exp = 10 ** Math.floor(Math.log10(v));
  const f = v / exp;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * exp;
}

/**
 * Line chart with crosshair tooltip. One shared y-axis (never dual-axis).
 * series: [{ name, points: [{ x: 'YYYY-MM-DD', y: number|null }] }], all with the same x list.
 */
function lineChart({ series, format = fmt.compact, height = 220, xFormat = fmt.dateShort }) {
  const root = h('div', { class: 'chart' });
  const xs = series[0]?.points.map((p) => p.x) || [];
  if (!xs.length || series.every((s) => s.points.every((p) => p.y == null))) {
    root.append(h('div', { class: 'empty' }, 'Sem dados no período.'));
    return root;
  }
  if (series.length > 1) {
    root.append(h('div', { class: 'chart-legend' }, series.map((s, i) => h('span', {}, h('i', { style: { background: seriesColor(i) } }), s.name))));
  }
  const plot = h('div', { class: 'chart-plot' });
  const tip = h('div', { class: 'tooltip hidden' });
  root.append(plot, tip);
  const values = series.flatMap((s) => s.points.map((p) => p.y)).filter((v) => v != null);
  const minV = Math.min(0, ...values);
  const maxV = niceMax(Math.max(...values));

  // Drawn at the container's real pixel width so text keeps its size on any screen.
  function draw(W) {
    const H = height;
    const m = { l: 8 + Math.max(...[0, 1, 2, 3, 4].map((i) => format(minV + ((maxV - minV) * i) / 4).length)) * 6.4, r: 12, t: 10, b: 24 };
    const x = (i) => m.l + (xs.length === 1 ? (W - m.l - m.r) / 2 : (i / (xs.length - 1)) * (W - m.l - m.r));
    const y = (v) => m.t + (1 - (v - minV) / (maxV - minV || 1)) * (H - m.t - m.b);
    const svg = h('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': series.map((s) => s.name).join(', ') });
    const axis = h('g', { class: 'axis' });
    for (let i = 0; i <= 4; i++) {
      const v = minV + ((maxV - minV) * i) / 4;
      axis.append(h('line', { class: i === 0 ? 'baseline' : 'gridline', x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
      axis.append(h('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, format(v)));
    }
    const maxLabels = Math.max(2, Math.floor((W - m.l - m.r) / 70));
    const step = Math.max(1, Math.ceil(xs.length / maxLabels));
    xs.forEach((d, i) => {
      if (i % step === 0) axis.append(h('text', { x: x(i), y: H - 6, 'text-anchor': i === 0 ? 'start' : 'middle' }, xFormat(d)));
    });
    svg.append(axis);
    series.forEach((s, si) => {
      let d = '';
      let pen = false;
      s.points.forEach((p, i) => {
        if (p.y == null) {
          pen = false;
          return;
        }
        d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`;
        pen = true;
      });
      svg.append(h('path', { d, fill: 'none', stroke: seriesColor(si), 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      if (xs.length <= 2) s.points.forEach((p, i) => p.y != null && svg.append(h('circle', { cx: x(i), cy: y(p.y), r: 4, fill: seriesColor(si) })));
    });
    const cross = h('line', { class: 'crosshair hidden', y1: m.t, y2: H - m.b });
    const dots = series.map((_, si) => h('circle', { r: 4, fill: seriesColor(si), stroke: 'var(--surface)', 'stroke-width': 2, class: 'hidden' }));
    svg.append(cross, ...dots);
    const hit = h('rect', { x: m.l, y: m.t, width: Math.max(0, W - m.l - m.r), height: H - m.t - m.b, fill: 'transparent' });
    svg.append(hit);
    hit.addEventListener('mousemove', (e) => {
      const rect = svg.getBoundingClientRect();
      const px = e.clientX - rect.left;
      const i = Math.max(0, Math.min(xs.length - 1, Math.round(((px - m.l) / (W - m.l - m.r)) * (xs.length - 1))));
      cross.setAttribute('x1', x(i));
      cross.setAttribute('x2', x(i));
      cross.classList.remove('hidden');
      clear(tip).append(h('div', { class: 't-title' }, fmt.date(xs[i])));
      series.forEach((s, si) => {
        const v = s.points[i].y;
        if (v != null) {
          dots[si].setAttribute('cx', x(i));
          dots[si].setAttribute('cy', y(v));
          dots[si].classList.remove('hidden');
        } else dots[si].classList.add('hidden');
        tip.append(h('div', { class: 't-row' }, h('i', { style: { background: seriesColor(si) } }), s.name, h('b', {}, v == null ? '—' : format(v))));
      });
      tip.classList.remove('hidden');
      const left = x(i) + 12 + tip.offsetWidth > W ? x(i) - tip.offsetWidth - 12 : x(i) + 12;
      tip.style.left = `${Math.max(0, left)}px`;
      tip.style.top = `${plot.offsetTop + 8}px`;
    });
    hit.addEventListener('mouseleave', () => {
      tip.classList.add('hidden');
      cross.classList.add('hidden');
      dots.forEach((d) => d.classList.add('hidden'));
    });
    clear(plot).append(svg);
  }

  let lastW = 0;
  const ro = new ResizeObserver(() => {
    const W = Math.floor(plot.clientWidth);
    if (W > 0 && Math.abs(W - lastW) > 2) {
      lastW = W;
      draw(W);
    }
  });
  ro.observe(plot);
  return root;
}

/** Horizontal bars (magnitude by category), single color, value labels on the right. */
function hbars(items, { format = fmt.n, max } = {}) {
  if (!items.length) return h('div', { class: 'empty' }, 'Sem dados no período.');
  const top = max ?? Math.max(...items.map((i) => i.value || 0), 1);
  return h(
    'div',
    { class: 'hbars' },
    items.map((it) =>
      h(
        'div',
        { class: 'hbar', title: it.title || `${it.label}: ${format(it.value)}` },
        h('span', { class: 'ellipsis' }, it.label),
        h('div', { class: 'hbar-track' }, h('div', { class: 'hbar-fill', style: { width: `${Math.max(0, (it.value || 0) / top) * 100}%` } })),
        h('span', { class: 'val' }, format(it.value), it.sub ? h('span', { class: 'subtle' }, ` · ${it.sub}`) : null)
      )
    )
  );
}

/**
 * Labelled scatter plot (positioning maps). points: [{ x, y, label, sub }]. Optional reference line at refY.
 */
function scatterChart({ points, xFormat = fmt.n, yFormat = fmt.n, xLabel = '', yLabel = '', refY = null, refLabel = '', height = 320 }) {
  const root = h('div', { class: 'chart' });
  const pts = points.filter((p) => p.x != null && p.y != null);
  if (!pts.length) {
    root.append(h('div', { class: 'empty' }, 'Sem dados suficientes.'));
    return root;
  }
  const plot = h('div', { class: 'chart-plot' });
  const tip = h('div', { class: 'tooltip hidden' });
  root.append(plot, tip);
  const ys = pts.map((p) => p.y).concat(refY != null ? [refY] : []);
  const xs = pts.map((p) => p.x);
  const pad = (lo, hi) => {
    const span = hi - lo || Math.abs(hi) || 1;
    return [lo - span * 0.12, hi + span * 0.12];
  };
  const [minY, maxY] = pad(Math.min(...ys), Math.max(...ys));
  const [minX, maxX] = pad(Math.min(...xs), Math.max(...xs));

  function draw(W) {
    const H = height;
    const m = { l: 52, r: 16, t: 14, b: 40 };
    const x = (v) => m.l + ((v - minX) / (maxX - minX || 1)) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - (v - minY) / (maxY - minY || 1)) * (H - m.t - m.b);
    const svg = h('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': `${yLabel} por ${xLabel}` });
    const axis = h('g', { class: 'axis' });
    for (let i = 0; i <= 4; i++) {
      const v = minY + ((maxY - minY) * i) / 4;
      axis.append(h('line', { class: i === 0 ? 'baseline' : 'gridline', x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
      axis.append(h('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, yFormat(v)));
      const xv = minX + ((maxX - minX) * i) / 4;
      axis.append(h('text', { x: x(xv), y: H - 22, 'text-anchor': i === 0 ? 'start' : i === 4 ? 'end' : 'middle' }, xFormat(xv)));
    }
    axis.append(h('text', { x: (m.l + W - m.r) / 2, y: H - 4, 'text-anchor': 'middle' }, xLabel));
    svg.append(axis);
    // Labels are nudged vertically so names of nearby points never sit on top of each other.
    const placed = [];
    const placeLabel = (cx, cy, text, right) => {
      const w = text.length * 7 + 4;
      const x0 = right ? cx - 11 - w : cx + 11;
      for (const dy of [0, -15, 15, -30, 30, -45, 45]) {
        const box = { x0, x1: x0 + w, y0: cy + dy - 9, y1: cy + dy + 5 };
        if (!placed.some((b) => box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0)) {
          placed.push(box);
          return cy + dy + 4;
        }
      }
      return cy + 4;
    };
    const refBox = refY != null && refLabel ? { x0: m.l + 4, x1: m.l + 10 + refLabel.length * 6.2, y0: y(refY) + 3, y1: y(refY) + 16 } : null;
    if (refY != null) {
      svg.append(h('line', { class: 'crosshair', x1: m.l, x2: W - m.r, y1: y(refY), y2: y(refY) }));
      if (refBox) {
        placed.push(refBox);
        svg.append(h('text', { x: refBox.x0, y: refBox.y1 - 2, fill: 'var(--text-3)', 'font-size': 11 }, refLabel));
      }
    }
    pts.forEach((p) => placed.push({ x0: x(p.x) - 8, x1: x(p.x) + 8, y0: y(p.y) - 8, y1: y(p.y) + 8 }));
    pts.forEach((p, i) => {
      const cx = x(p.x);
      const cy = y(p.y);
      const color = p.own ? 'var(--accent)' : seriesColor(i);
      const right = cx > W - 160;
      const ly = placeLabel(cx, cy, p.label, right);
      const g = h('g', { tabindex: '0', style: { cursor: 'default' } },
        h('circle', { cx, cy, r: p.own ? 8 : 7, fill: color, 'fill-opacity': 0.9, stroke: 'var(--surface)', 'stroke-width': 2 }),
        h('text', { x: cx + (right ? -11 : 11), y: ly, 'text-anchor': right ? 'end' : 'start', fill: 'var(--text)', 'font-size': 12, 'font-weight': p.own ? 700 : 600 }, p.label));
      const show = () => {
        clear(tip).append(h('div', { class: 't-title' }, p.label), h('div', { class: 't-row' }, xLabel, h('b', {}, xFormat(p.x))), h('div', { class: 't-row' }, yLabel, h('b', {}, yFormat(p.y))), p.sub ? h('div', { class: 't-row' }, p.sub) : null);
        tip.classList.remove('hidden');
        const left = cx + 14 + tip.offsetWidth > W ? cx - tip.offsetWidth - 14 : cx + 14;
        tip.style.left = `${Math.max(0, left)}px`;
        tip.style.top = `${Math.max(0, cy - 20)}px`;
      };
      g.addEventListener('mouseenter', show);
      g.addEventListener('focus', show);
      g.addEventListener('mouseleave', () => tip.classList.add('hidden'));
      g.addEventListener('blur', () => tip.classList.add('hidden'));
      svg.append(g);
    });
    clear(plot).append(svg);
  }

  let lastW = 0;
  const ro = new ResizeObserver(() => {
    const W = Math.floor(plot.clientWidth);
    if (W > 0 && Math.abs(W - lastW) > 2) {
      lastW = W;
      draw(W);
    }
  });
  ro.observe(plot);
  return root;
}

// Continuous date list for charts.
function dateRange(from, to) {
  const out = [];
  for (let d = from; d <= to; d = addDays(d, 1)) out.push(d);
  return out;
}

function periodSelect(value, onChange) {
  return h(
    'select',
    { class: 'input', 'aria-label': 'Período', onchange: (e) => onChange(Number(e.target.value)) },
    [[7, 'Últimos 7 dias'], [30, 'Últimos 30 dias'], [90, 'Últimos 90 dias'], [180, 'Últimos 6 meses'], [365, 'Último ano']].map(([v, l]) =>
      h('option', { value: v, selected: v === value }, l)
    )
  );
}

function copyToClipboard(text) {
  return navigator.clipboard.writeText(text).then(
    () => toast('Copiado!'),
    () => toast('Não foi possível copiar.', 'error')
  );
}

function safeUrl(u) {
  try {
    const url = new URL(u);
    return ['http:', 'https:'].includes(url.protocol) ? url.href : null;
  } catch {
    return null;
  }
}

function extLink(u, text) {
  const href = safeUrl(u);
  return href ? h('a', { href, target: '_blank', rel: 'noopener noreferrer' }, text || 'abrir ↗') : null;
}

// Generic CRUD form for simple resources.
function crudForm({ ctx, resource, title, fields, item, onSaved, defaults = {}, wide }) {
  const readOnly = !canWrite(ctx);
  formModal({
    title: item ? (readOnly ? title : `Editar ${title.toLowerCase()}`) : `Novo(a) ${title.toLowerCase()}`,
    fields,
    values: item || defaults,
    enums: ctx.enums,
    wide,
    submitText: readOnly ? 'Fechar' : 'Salvar',
    onSubmit: async (data) => {
      if (readOnly) return;
      if (item) await api.put(`/${resource}/${item.id}`, data);
      else await api.post(`/${resource}`, data);
      toast('Salvo.');
      onSaved();
    },
    onDelete: item && !readOnly ? async () => {
      await api.del(`/${resource}/${item.id}`);
      toast('Excluído.');
      onSaved();
    } : null,
  });
}

const fields = [
