// Higher volume, lower difficulty, worse current position → bigger opportunity (0–100).
function opportunity(k) {
  if (!k.search_volume) return null;
  const vol = Math.min(1, Math.log10(k.search_volume + 1) / 5);
  const ease = 1 - (k.difficulty ?? 50) / 100;
  const gap = k.position == null ? 1 : k.position <= 3 ? 0.2 : k.position <= 10 ? 0.6 : 1;
  return Math.round(vol * ease * gap * 100);
}

async function render(root, ctx) {
  const filters = { channel: '', intent: '', q: '' };

            { label: 'Dific.', key: 'difficulty', align: 'right', render: (k) => fmt.n(k.difficulty) },

// Rough strength estimate shown while typing (server enforces the real policy).
function strength(pw, user = {}) {
  let score = 0;
  if (pw.length >= 10) score++;
  if (pw.length >= 14) score++;
  if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
  if (/\d/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const local = String(user.email || '').split('@')[0].toLowerCase();
  if (local.length >= 4 && pw.toLowerCase().includes(local)) score = 0;
  return Math.min(score, 4);
}

function passwordField(labelText, user) {
  const input = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', required: true, minlength: '10' });
  const bar = h('span', {});
  const hint = h('span', { class: 'help' }, 'Mínimo de 10 caracteres, com letras e números. Use uma frase longa.');
  const COLORS = ['var(--critical)', 'var(--critical)', 'var(--serious)', 'var(--warning)', 'var(--good)'];
  const NAMES = ['muito fraca', 'fraca', 'razoável', 'boa', 'forte'];
  input.addEventListener('input', () => {
    const s = strength(input.value, user);
    bar.style.width = input.value ? `${(s + 1) * 20}%` : '0';
    bar.style.background = COLORS[s];
    hint.textContent = input.value ? `Força: ${NAMES[s]}` : 'Mínimo de 10 caracteres, com letras e números. Use uma frase longa.';
  });
  const field = h('div', { class: 'field' }, h('label', {}, labelText), input, h('div', { class: 'strength' }, bar), hint);
  return { field, input };
}

function stepUpFields(user) {
  const password = h('input', { class: 'input', type: 'password', autocomplete: 'current-password', required: true });
  const code = h('input', { class: 'input', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', required: !!user.totp_enabled, placeholder: '000000' });
  const nodes = [h('div', { class: 'field' }, h('label', {}, 'Sua senha'), password)];
  if (user.totp_enabled) nodes.push(h('div', { class: 'field' }, h('label', {}, 'Código atual do app autenticador'), code));
  return { nodes, values: () => ({ password: password.value, code: code.value }) };
}

function describeAgent(ua) {
  const s = String(ua || '');
  const browser = /Edg\//.test(s) ? 'Edge' : /Chrome\//.test(s) ? 'Chrome' : /Firefox\//.test(s) ? 'Firefox' : /Safari\//.test(s) ? 'Safari' : 'Navegador';
  const os = /iPhone|iPad/.test(s) ? 'iOS' : /Android/.test(s) ? 'Android' : /Mac OS X/.test(s) ? 'macOS' : /Windows/.test(s) ? 'Windows' : /Linux/.test(s) ? 'Linux' : '';
  return `${browser}${os ? ` · ${os}` : ''}`;
}

  const bad = invert ? v < 0.97 : v > 1.05;
  const good = invert ? v > 1.03 : v < 0.97;
  return h('span', { class: `delta ${bad ? 'down' : good ? 'up' : ''}`, title: `${fmt.n1(v * 100)} (100 = média)` }, indexText(v));
};

async function render(root, ctx) {
  let tab = ctx.params.get('aba') || 'visao';
  const filters = { category: '', status: '', q: '' };
  const body = h('div', { class: 'stack' });
  const actions = h('div', { class: 'toolbar' });
  root.append(
    h('div', { class: 'page-head' },
      h('div', {}, h('h1', {}, 'Mapa de concorrentes — vidrarias'), h('p', { class: 'muted' }, 'Quem vende vidrarias de laboratório, a que preço, com quais marcas — e onde a InoveLabor está mais cara, mais barata ou ausente.')),
      actions),
    tabs([['visao', 'Visão geral'], ['precos', 'Matriz de preços'], ['concorrentes', 'Concorrentes'], ['marcas', 'Marcas'], ['oportunidades', 'Oportunidades'], ['segmentos', 'Segmentos de clientes']], (k) => { tab = k; draw(); }, tab),
    body
  );

  let data = null;
  async function load() {
    data = await api.get('/analytics/glassware');
    return data;
  }

  async function draw() {
    clear(body);
    clear(actions);
    body.append(loading());
    if (tab === 'segmentos') return drawSegments();
    await load();
    clear(body);
    if (canWrite(ctx)) {
      actions.append(
        h('button', { class: 'btn', onclick: importCsv }, icon('log'), 'Importar CSV'),
        h('button', { class: 'btn', onclick: () => crudForm({ ctx, resource: 'glass_products', title: 'Produto (vidraria)', fields: productFields, onSaved: draw, wide: true }) }, icon('plus'), 'Produto'),
        h('button', { class: 'btn primary', onclick: () => collect() }, icon('plus'), 'Registrar coleta de preços'));
    }
    if (!data.products.length) {
      body.append(h('div', { class: 'card empty' }, 'Cadastre as vidrarias que quer acompanhar e registre os preços dos concorrentes.'));
      return;
    }
    ({ visao: drawOverview, precos: drawMatrix, concorrentes: drawCompetitors, marcas: drawBrands, oportunidades: drawOpportunities }[tab] || drawOverview)();
  }

  async function priceForm(p, offer, onSaved) {
    const comps = await api.get('/competitors');
    const fields = [
      { name: 'competitor_id', label: 'Concorrente', type: 'select', required: true, options: comps.map((c) => [c.id, c.name]) },
      { name: 'date', label: 'Data da coleta', type: 'date', required: true },
      { name: 'price', label: 'Preço (R$)', type: 'money', required: true },
      { name: 'brand', label: 'Marca' },
      { name: 'in_stock', label: 'Disponível em estoque', type: 'checkbox' },
      { name: 'url', label: 'Link do produto', type: 'url', full: true },
    ];
    formModal({
      title: `Preço · ${p.name}`,
      fields,
      values: offer ? { ...offer, date: today(), in_stock: !!offer.in_stock } : { date: today(), in_stock: true },
      onSubmit: async (d) => {
        await api.post('/glass_prices/batch', { competitor_id: d.competitor_id, date: d.date, items: [{ product_id: p.id, price: d.price, brand: d.brand, in_stock: d.in_stock, url: d.url }] });
        toast('Preço registrado.');
        onSaved();
      },
      onDelete: offer && canWrite(ctx) ? async () => { await api.del(`/glass_prices/${offer.id}`); toast('Preço removido.'); onSaved(); } : null,
    });
  }

  // Bulk collection: one competitor, every product in one form.
  async function collect(competitorId) {
    const comps = await api.get('/competitors');
    if (!comps.length) return toast('Cadastre um concorrente primeiro.', 'error');
    const sel = h('select', { class: 'input', required: true }, comps.map((c) => h('option', { value: c.id, selected: String(c.id) === String(competitorId || '') }, c.name)));
    const date = h('input', { class: 'input', type: 'date', value: today(), required: true });
    const brand = h('input', { class: 'input', placeholder: 'marca padrão (opcional)' });
    const err = h('div', { class: 'alert error hidden', role: 'alert' });
    const inputs = data.products.map((p) => {
      const current = () => p.offers.find((o) => String(o.competitor_id) === sel.value);
      const price = h('input', { class: 'input', type: 'number', step: '0.01', min: '0', placeholder: 'R$', style: { maxWidth: '120px' } });
      const stock = h('input', { type: 'checkbox', checked: true, 'aria-label': 'Disponível' });
      const hint = h('span', { class: 'subtle' });
      const refresh = () => { const o = current(); hint.textContent = o ? `último: ${fmt.money(o.price)} (${fmt.date(o.date)})` : ''; };
      refresh();
      return { p, price, stock, refresh, row: h('tr', {}, h('td', {}, h('div', {}, p.name), hint), h('td', { class: 'right' }, fmt.money(p.our_price)), h('td', {}, price), h('td', {}, h('label', { class: 'check' }, stock, 'em estoque'))) };
    });
    sel.addEventListener('change', () => inputs.forEach((i) => i.refresh()));
    const save = h('button', { class: 'btn primary' }, 'Salvar preços');
    const m = modal({
      title: 'Registrar coleta de preços',
      wide: true,
      body: h('div', { class: 'stack' },
        h('p', { class: 'muted' }, 'Abra o site do concorrente e preencha só os itens encontrados. Itens em branco são ignorados.'),
        err,
        h('div', { class: 'form-grid' }, h('div', { class: 'field' }, h('label', {}, 'Concorrente'), sel), h('div', { class: 'field' }, h('label', {}, 'Data da coleta'), date), h('div', { class: 'field full' }, h('label', {}, 'Marca'), brand)),
        h('div', { class: 'table-wrap' }, h('table', { class: 'table' }, h('thead', {}, h('tr', {}, h('th', {}, 'Produto'), h('th', { class: 'right' }, 'Nosso preço'), h('th', {}, 'Preço do concorrente'), h('th', {}, ''))), h('tbody', {}, inputs.map((i) => i.row))))),
      actions: [h('button', { class: 'btn', onclick: () => m.close() }, 'Cancelar'), save],
    });
    save.addEventListener('click', async () => {
      const items = inputs.filter((i) => i.price.value !== '').map((i) => ({ product_id: i.p.id, price: Number(i.price.value), in_stock: i.stock.checked, brand: brand.value || i.p.offers.find((o) => String(o.competitor_id) === sel.value)?.brand || null }));
      if (!items.length) { err.textContent = 'Preencha ao menos um preço.'; err.classList.remove('hidden'); return; }
      save.disabled = true;
      try {
        const r = await api.post('/glass_prices/batch', { competitor_id: Number(sel.value), date: date.value, items });
        toast(`${r.saved} preços salvos.`);
        m.close();
        draw();
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('hidden');
      } finally {
        save.disabled = false;
      }
    });
  }

  function importCsv() {
    const ta = h('textarea', { class: 'input', rows: 10, placeholder: 'produto;concorrente;marca;preco;url;estoque;data\nBéquer forma baixa 250 mL;LabShop Brasil;VitroLab;18,90;https://…;sim;2026-10-07' });
    const out = h('div', {});
    const btn = h('button', { class: 'btn primary' }, 'Importar');
    const m = modal({
      title: 'Importar preços (CSV)',
      wide: true,
      body: h('div', { class: 'stack' },
        h('p', { class: 'muted' }, 'Cole uma planilha com cabeçalho. Colunas: produto (ou sku), concorrente, marca, preco, url, estoque (sim/não), data (AAAA-MM-DD). Separador ponto e vírgula, vírgula ou tabulação. Produtos e concorrentes precisam estar cadastrados com o mesmo nome.'),
        ta, out),
      actions: [h('button', { class: 'btn', onclick: () => m.close() }, 'Fechar'), btn],
    });
    btn.addEventListener('click', async () => {
      const lines = ta.value.split(/\r?\n/).filter((l) => l.trim());
      if (lines.length < 2) return toast('Cole o cabeçalho e ao menos uma linha.', 'error');
      const sep = lines[0].includes('\t') ? '\t' : lines[0].includes(';') ? ';' : ',';
      const head = lines[0].split(sep).map((x) => x.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''));
      const rows = lines.slice(1).map((l) => Object.fromEntries(l.split(sep).map((v, i) => [head[i], v.trim()])));
      btn.disabled = true;
      try {
        const r = await api.post('/glass_prices/import', { rows });
        append(clear(out), [h('div', { class: `alert ${r.skipped_count ? 'warn' : 'ok'}` }, `${r.saved} preços importados${r.skipped_count ? `, ${r.skipped_count} ignorados` : ''}.`),

        try {
          const body = useRecovery ? { pending_token: pendingToken, recovery_code: recovery.value } : { pending_token: pendingToken, code: code.value };
          const r = await api.post('/auth/login/mfa', body);
          if (r.recovery_codes_remaining != null) {
            toast(`Código de recuperação usado. Restam ${r.recovery_codes_remaining}. Gere novos em Minha conta.`);
          }
          await boot();
        } catch (ex) {
          if (ex.data?.code === 'pending_expired') return renderLogin(ex.message);
          showErr(err, ex.message);
          code.value = '';
          code.focus();
        } finally {
          btn.disabled = false;
        }
      },
    },
    err,
    codeField,
    recField,
    btn,
    toggle
  );
  clear(app).append(authShell(h('h1', {}, 'Verificação em duas etapas'), h('p', { class: 'muted' }, 'Abra o app autenticador e digite o código de 6 dígitos.'), form));
}

async function renderMfaSetup(pendingToken) {
  const err = errorLine();
  let setup;
  try {
    setup = await api.post('/auth/login/mfa-setup', { pending_token: pendingToken });
  } catch (ex) {
    return renderLogin(ex.message);
  }
  const qr = h('div', { class: 'qr', 'aria-label': 'QR code para o app autenticador' });
  // Server-generated SVG (only path/rect elements built from the TOTP secret).
  qr.append(new DOMParser().parseFromString(setup.qr_svg, 'image/svg+xml').documentElement);
  const code = otpInput();
  const btn = h('button', { class: 'btn primary block', type: 'submit' }, 'Ativar e entrar');
  const form = h(
    'form',
    {
      onsubmit: async (e) => {
        e.preventDefault();
        btn.disabled = true;
        try {
          const r = await api.post('/auth/login/mfa-setup/confirm', { pending_token: pendingToken, code: code.value });
          renderRecoveryCodes(r.recovery_codes, boot);
        } catch (ex) {
          if (ex.data?.code === 'pending_expired') return renderLogin(ex.message);
          showErr(err, ex.message);
        } finally {
          btn.disabled = false;
        }
      },
    },
    err,
    h('div', { class: 'field' }, h('label', {}, 'Código gerado pelo app'), code),
    btn
  );
  clear(app).append(
    authShell(
      h('h1', {}, 'Configure a verificação em duas etapas'),
      h('p', { class: 'muted' }, 'Por segurança, o 2FA é obrigatório. Instale o Google Authenticator, Microsoft Authenticator, Authy ou 1Password e escaneie o QR code.'),
      qr,
      h('details', {}, h('summary', { class: 'subtle' }, 'Não consegue escanear? Digite a chave manualmente'), h('div', { class: 'secret' }, setup.secret.replace(/(.{4})/g, '$1 ').trim())),
      form
    )
  );
}

function renderRecoveryCodes(codes, onDone) {
  const ack = h('input', { type: 'checkbox', id: 'ack' });
  const btn = h('button', { class: 'btn primary block', disabled: true, onclick: () => onDone() }, 'Continuar');
  ack.addEventListener('change', () => (btn.disabled = !ack.checked));
  const text = codes.join('\n');
  const download = () => {
    const blob = new Blob([`InoveLabor Marketing — códigos de recuperação\nGerados em ${new Date().toLocaleString('pt-BR')}\nCada código funciona uma única vez.\n\n${text}\n`], { type: 'text/plain' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'inovelabor-codigos-recuperacao.txt' });
    document.body.append(a);
    a.click();
    a.remove();
  };
  clear(app).append(
    authShell(
      h('h1', {}, 'Guarde seus códigos de recuperação'),
      h('p', { class: 'muted' }, 'Se perder o celular, use um destes códigos para entrar. Cada um funciona uma vez. Eles não serão mostrados novamente.'),
      h('div', { class: 'codes', 'aria-label': 'Códigos de recuperação' }, codes.map((c) => h('span', {}, c))),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: download }, 'Baixar .txt'), h('button', { class: 'btn', onclick: () => navigator.clipboard.writeText(text).then(() => toast('Copiado!')) }, 'Copiar')),
      h('label', { class: 'check', for: 'ack' }, ack, 'Guardei os códigos em local seguro'),
      btn
    )
  );
}

function renderForcedPasswordChange() {
  const err = errorLine();
  const current = h('input', { class: 'input', type: 'password', autocomplete: 'current-password', required: true });
  const { field: newField, input: next } = passwordField('Nova senha', state.user);
  const confirm = h('input', { class: 'input', type: 'password', autocomplete: 'new-password', required: true });
  const btn = h('button', { class: 'btn primary block', type: 'submit' }, 'Salvar nova senha');
  const form = h(
    'form',
    {
      onsubmit: async (e) => {
        e.preventDefault();
        if (next.value !== confirm.value) return showErr(err, 'As senhas não conferem.');
        btn.disabled = true;
        try {
          await api.post('/auth/change-password', { current_password: current.value, new_password: next.value });
          toast('Senha alterada.');
          await boot();
        } catch (ex) {
          showErr(err, ex.message);
        } finally {
          btn.disabled = false;
        }
      },
    },
    err,
    h('div', { class: 'field' }, h('label', {}, 'Senha atual (temporária)'), current),
    newField,
    h('div', { class: 'field' }, h('label', {}, 'Confirme a nova senha'), confirm),
    btn
  );
  clear(app).append(
    authShell(
      h('h1', {}, 'Crie sua senha'),
      h('p', { class: 'muted' }, 'Sua senha atual é temporária. Escolha uma senha pessoal com pelo menos 10 caracteres, letras e números.'),
      form,
      h('button', { class: 'link-btn', onclick: logout }, 'Sair')
    )
  );
}

async function logout() {
  try {
    await api.post('/auth/logout');
  } catch {
    /* ignore */
  }
  state.user = null;
  location.hash = '';
  renderLogin('Você saiu do sistema.');
}

// ---------- Shell ----------
let shellEls = null;

function renderShell() {
  const nav = h('nav', { class: 'nav', 'aria-label': 'Menu principal' });
  for (const item of NAV) {
    if (item.hidden || (item.admin && state.user.role !== 'admin')) continue;
    if (item.group) nav.append(h('div', { class: 'nav-group' }, item.group));
    else nav.append(h('a', { href: `#/${item.path}`, dataset: { path: item.path } }, icon(item.icon), h('span', {}, item.label)));
  }
  const content = h('main', { class: 'content', id: 'content', tabindex: '-1' });
  const shell = h(
    'div',
    { class: 'shell' },
    h(
      'aside',
      { class: 'sidebar' },
      h('div', { class: 'brand' }, h('div', { class: 'brand-mark' }, 'IL'), h('div', {}, h('div', { class: 'brand-name' }, 'INOVELABOR'), h('div', { class: 'brand-sub' }, 'Central de marketing'))),
      nav,
      h(
        'div',
        { class: 'sidebar-foot' },
        h(
          'a',
          { class: 'user-chip', href: '#/seguranca', title: 'Minha conta e segurança' },
          h('span', { class: 'avatar' }, fmt.initials(state.user.name)),
          h('span', { class: 'grow' }, h('div', { class: 'ellipsis' }, state.user.name), h('div', { class: 'subtle' }, label(state.user.role)))
        ),
        h('div', { class: 'row' },
          h('button', { class: 'btn ghost sm', onclick: toggleTheme, title: 'Alternar tema claro/escuro' }, icon('sun'), 'Tema'),
          h('span', { class: 'spacer' }),
          h('button', { class: 'btn ghost sm', onclick: logout }, icon('logout'), 'Sair'))
      )
    ),
    h('div', { class: 'backdrop', onclick: () => shell.classList.remove('nav-open') }),
    h(
      'div',
      { class: 'main' },
      h('header', { class: 'topbar' }, h('button', { class: 'btn ghost icon', 'aria-label': 'Abrir menu', onclick: () => shell.classList.add('nav-open') }, icon('menu')), h('strong', {}, 'InoveLabor')),
      content
    )
  );
  clear(app).append(shell);
  shellEls = { shell, nav, content };
}

function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try {
    localStorage.setItem('il-theme', root.dataset.theme);
  } catch {
    /* storage unavailable */
  }
}
try {
  const saved = localStorage.getItem('il-theme');
  if (saved) document.documentElement.dataset.theme = saved;
} catch {
  /* storage unavailable */
}

let renderToken = 0;
async function route() {
  if (!state.user) return;
  if (!shellEls) renderShell();
  const { path, params } = currentRoute();
  const item = NAV.find((n) => n.path === path && (!n.admin || state.user.role === 'admin')) || NAV[1];
  for (const a of shellEls.nav.querySelectorAll('a')) a.classList.toggle('active', a.dataset.path === item.path);
  shellEls.shell.classList.remove('nav-open');
  const token = ++renderToken;
  const content = clear(shellEls.content);
  content.append(h('div', { class: 'empty' }, 'Carregando…'));
  try {
    const mod = await item.view();
    if (token !== renderToken) return;
    clear(content);
    document.title = `${item.label} · InoveLabor Marketing`;
    await mod.render(content, { ...state, params, navigate, refreshUsers, renderRecoveryCodes: (codes, done) => renderRecoveryCodes(codes, done || boot) });
  } catch (err) {
    if (token !== renderToken) return;
    clear(content).append(h('div', { class: 'alert error' }, err.message || 'Falha ao carregar a página.'));
  }
}

async function refreshUsers() {
  state.users = await api.get('/users');
  return state.users;
}

async function boot() {
  shellEls = null;
  try {
    const me = await api.get('/auth/me');
    state.user = me.user;
    state.require2fa = me.require2fa;
    if (state.user.must_change_password) return renderForcedPasswordChange();
    const [meta] = await Promise.all([api.get('/meta'), refreshUsers()]);
    state.enums = meta.enums;
    if (me.recovery_codes_remaining != null && me.user.totp_enabled && me.recovery_codes_remaining <= 2) {
      setTimeout(() => toast(`Restam ${me.recovery_codes_remaining} códigos de recuperação. Gere novos em Minha conta.`), 500);
    }
    await route();
  } catch (err) {
    if (err.status === 401) renderLogin();
    else if (err.data?.code !== 'password_change_required') clear(app).append(authShell(h('div', { class: 'alert error' }, err.message)));
  }
}

setAuthHandler((code) => {
  if (code === 'password_change_required') renderForcedPasswordChange();
  else if (state.user) {
    state.user = null;
    shellEls = null;
    renderLogin('Sua sessão expirou. Entre novamente.');
  }
});

window.addEventListener('hashchange', route);
boot();

})();
</script>
</body>
</html>
